<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- Fills the browser window (or the itch.io iframe) at whatever size it happens to be.
         The stock Default template hard-codes the canvas to the Player Settings width/height in
         pixels, so any embed smaller than that crops the game instead of scaling it. -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
      #unity-container {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
      }
      /* Percentage sizing is the whole point: Unity keeps the render target matched to the
         canvas' DOM size, so resizing the window/iframe re-renders at the new size */
      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        width: min(60%, 320px);
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 12px;
        background: #2b2b2b;
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #e8b0d0;
        transition: width 0.1s linear;
      }
      #unity-loading-text {
        color: #fff;
        text-align: center;
        margin-bottom: 8px;
        font-size: 14px;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translate(-50%, 0);
        color: #fff;
        text-align: center;
        z-index: 10;
      }
      /* Kept deliberately small and out of the way - jam pages are cramped enough */
      #unity-fullscreen-button {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 28px;
        height: 28px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        display: none;
      }
      #unity-fullscreen-button::before {
        content: "";
        position: absolute;
        top: 8px; left: 8px; right: 8px; bottom: 8px;
        border: 2px solid #fff;
        border-radius: 2px;
        opacity: 0.85;
      }
      #unity-fullscreen-button:hover::before { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-loading-text">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-fullscreen-button" title="Fullscreen"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; color: #000; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      // Render at CSS pixels rather than the display's real pixel density. On a HiDPI laptop the
      // default would quadruple the pixels being shaded for no visible gain on pixel art, and a
      // jam build in an iframe needs the frame rate more than the sharpness.
      config.devicePixelRatio = 1;

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fullscreenButton = document.querySelector("#unity-fullscreen-button");
          fullscreenButton.style.display = "block";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
          // The canvas only takes keyboard input while focused, and inside an itch iframe it
          // starts unfocused - without this the player has to click the game before WASD works
          canvas.focus();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
